S:
  - name: "Hollow Knight : Silksong"
    desc: "My favourite video game.\n
    After a bit of reflection, I can't separate Silksong from Hollow Knight. It's a continuation, it's everything Hollow Knight tried to do and more.\n
    A masterpiece. Even after 100%, speedrunning, studying it and trying to write an essay on it, I can't fully grasp just how insanely good this game is."

  - name: "Hollow Knight"
    desc: "My favourite video game.\n
    This shit is the bee knee's and I don't fuck around with those words.\n
    Ambience, exploration, gameplay, story, soundtrack - this game has it all."

  - name: "Super Mario Galaxy"
    desc: "My second favourite favourite video game.\n
    Level design ? Yes, of course. Soundtrack ? Fucking amazing. Ambience ? Probably the best in any game I've played.\n
    This shit rocks."

  - name: "Outer Wilds"
    desc: "A knowledge-based puzzle game - any spoilers can ruin the experience PERMANENTLY.\n
    I can't tell you anything about this game. Just, play it. Whatever it costs, just buy it, and play it, and don't ask questions.\n
    In my opinion, this is probably the best game ever made."

  - name: "Hyper Light Drifter"
    desc: "A fast-paced 2D RPG with a lot of exploration and secrets.\n
    A masterpiece in level design, ambience, and world building, all packed in a short playthrough. How the fuck does this game work with NO LINES OF TEXT (apart from the pause menu) ?\n
    I cannot put into words how good the game is. Play it."

  - name: "Slay The Princess"
    desc: "One of the only two dialogue-based games that I love.\n 
    Slay The Princess manages its themes, atmospheres and character really well. Kind of a horror game ? And at the same time, a love story.\n Huge recommend."

  - name: "Disco Elysium"
    desc: "How can I even describe this game accurately...\n
    Disco Elysium masterfully blends painted textures, deep and complex characters, immersive storytelling and an incredible art direction.\n
    It's a very easy game to get into. And you should play it."

  - name: "The Stanley Parable"
    desc: "Who doesn't love this game.\n
    The very concept is already very cool, but it actually makes use of it ??? Correctly ????\n
    Always funny to force people to play through the game, just to see what they'll do."

  - name: "Zelda : Twilight Princess"
    desc: "The first Zelda game that really impacted me.\n
    It lacks in a lot of area, but makes up for it with incredible ambience, and an immersive story and universe.\n 
    We've never again reached the sheer oppressiveness of the Twilight's atmosphere."

  - name: "Splatoon 2 : Octo Expansion"
    desc: "The best content in the Splatoon series, and the only reason anyone would buy Splatoon 2 now.\n
    The vaporwave aesthetic is exquisite, excellent level design and gameplay. They knew they missed the mark with Splatoon 2's campaign, so... they made up for it.\n
    And god damn did they succeed."

  - name: "Warframe"
    desc: "In a nutshell : the blueprint by which every free game should build itself.\n
    The only good free-to-play.\n
    At every turn, Warframe had the opportunity to dissapoint me, and it never did. The devs keep delivering new, original, artistic content for the price of absolutely nothing.\n"

A:
  - name: "Outer Wilds : Echoes of the Eye"
    desc: "The DLC is great! It's still really in the same vibe as the base game.\n
    But in my opinion, the DLC could've been *better*. And that's my only problem with it.\n
    It's still like, one of the best pieces of content in a video game ever, so I forgive <3"

  - name: "Clair Obscur : Expedition 33"
    desc: "A very French turn-based RPG with parries.\n
    This is just Mario & Luigi gameplay with better graphics and more builds. The parries feel so good in that game.\n
    The music, the art direction, the characters and the plot are on point. Nothing to say there, absolute cinema.\n
    The only bad part is the open-world / roam gameplay. The scenery is pretty, but there's kinda nothing to do."

  - name: "Bloodborne"
    desc: "My favourite Soulslike game..\n
    I really like the aesthetic of this game. The combat feels good and the lore is great. But the Lovecraftian horror is what brings it up so much."

  - name: "Tunic"
    desc: "Another knowledge-based puzzle game with quick combat gameplay.\n
    Tunic is great - from the art style to the puzzles. It's a really nice experience that's 10 times deeper than what it appears."

  - name: "Zelda : Breath of the Wild"
    desc: "Looking at it objectively, probably the best 3D Zelda game.\n
    While the world can feel a bit empty, and the UI is definitely not the best, the game's atmosphere and terrain are god damn marvelous, and the world building is quite good as well."

  - name: "Splatoon 3"
    desc: "Octo Expansion's formula, revisited with incredible art direction and soundtrack - not uncommon for Splatoon games.\n
    It does lack a bit in inovation compared to Octo Expansion, but the realisation is perfect, so who can complain.\n"

  - name: "Little Nightmares 2"
    desc: "The second installment is better than the first ! Improvement is a scarce quality in modern game studios...\n
    Level design is better, environnements improved and are more diverse.\n
    Cinematically, even better than the first. And the bad guys are even scarier."

  - name: "Blue Prince"
    desc: "A roguelike knowledge-based puzzle game.\n
    This is the kind of design that really doesn't sound good, but is actually genius in so many ways.\n
    Pretty fun, insane lore and secrets, and a great artstyle. The design fails in some aspects (like rewarding the player) but it's still reaaaaaally good."

  - name: "Hades 2"
    desc: "Well, shit. I can't complain anymore.\n
    My main complaint with Hades was the underdeveloped roguelite aspect of it. Hades 2 is both more and less of a roguelite, and I feel like this is exactly what the game was supposed to be.\n
    I still play this game like a dating sim. Icarus is adorable."

  - name: "Balatro"
    desc: "A rogue-lite deckbuilder with jazzy art direction and music.\n
    This game is addictive. Like, actually addictive.\n
    It starts pretty simple, but very soon you have hands scoring bajillion chips and thousands of dollards.\n
    Only one sentence to summarise this game :\n
    Number Go Up."  

  - name: "Ultrakill"
    desc: "Dopamine in a box. Jesus Christ this game spikes my adrenaline levels.\n
    Genuinely good gameplay and level design. Incredible soundtrack.\n
    MANKIND IS DEAD. BLOOD IS FUEL. HELL IS FULL."

  - name: "Titanfall 2"
    desc: "The pinnacle of FPS cinematic single-player campaigns, for 3€.\n
    Although quite short, the campaign is great - incredible gameplay, environnements, and level design."

  - name: "Bomb Rush Cyberfunk"
    desc: "Gets a pass straight to A Tier just for reviving the Jet Set Radio fanbase.\n
    Funky beats, great parkour/tricks gameplay, and a story this time (although not very developped...)"

  - name: "Little Nightmares"
    desc: "The first installment of my favourite horror game series.\n
    Damn, the ambience in the game is HEAVY. This shit makes me shiver me timbers without any jumpscares.\n
    Also, cinematically and environnementally, insane game."


B:
  - name: "Soulframe"
    desc: "A medieval-fantasy free-to-play, from the Warframe devs.\n
    I am NOT a fan of traditional fantasy universes. I've read Tolkien and it was nice, but I don't like that 90% of fantasy media are elves, dwarves and dragons.\n
    Soulframe breaks that completely by actually being medieval as fuck. Old English is used so much I have a tough time understanding the game, and it's GREAT, actually.\n
    Game is unfinished and still in closed beta, but it's going in a great direction."

  - name: "Slay The Spire"
    desc: "A very addictive deck-building roguelike.\n
    I am NOT a huge fan of deck-building games, but Slay The Spire executes its idea pretty damn good.\n
    I felt like the art direction was a little... bland ? But honestly the gameplay made up for it."

  - name: "Risk of Rain 2"
    desc: "The best 3D roguelite out there.\n
    Ignoring the dissapointing updates from Gearbox, the game's ambience, gameplay and music makes it so that every run feels different, but part of a coherent whole. It's great.\n
    Mods are also great. Everything Gearbox touches turns to coal."

  - name: "Splatoon"
    desc: "The start of a great saga with a great gameplay foundation.\n
    Some of the best level design I have witnessed, with insane soundtrack and world building.\n
    I wish it hadn't held back on art direction. It looks almost neutered compared to other games in the series."

  - name: "Jet Set Radio Future"
    desc: "Jet Set Radio but with good gameplay this time.\n
    Story is still... non-existent, but the vibe is clearer now. The funky beats are also way better, in my opinion."

  - name: "Super Mario Galaxy 2"
    desc: "Not what I wanted for a second installment in the series...\n
    Ambience got gutted in favor of better levels, and while the soundtrack is good, it's very underutilised and sometimes even just not used correctly."

  - name: "Pacific Drive"
    desc: "An open-world survival horror roguelite car game. Yeah, all of those things.\n
    Well, kinda. Pacific Drive is a masterclass on manipulating ambience and vibes to push the player further on.
    Excellent rendition of the environment : this game made me feel nostalgia for a place I never visited, and a time I never even knew."

  - name: "Hades"
    desc: "A great game all around! But makes poor use of its roguelite elements.\n
    The game is pretty, characters are hot, gameplay is fun and story is complex and interesting. It's just a shame the game's so... repetitive."

  - name: "Enter the Gungeon"
    desc: "Probably my favourite 2D roguelite.\n
    Art direction is crazy, gameplay's insane and soundtrack is a banger.\n
    Every run is really different, and since most items are references, it's really fun if you're a huge nerd.\n
    Minus points for being a \"wiki opened\" kinda game."

  - name: "Celeste"
    desc: "Good soundtrack, good level design & gameplay, not much else to say.\n
    Celeste is just... a great game. But that's it. It's pretty but never gorgeous, fun but never exhilarating, it's just a solid, great game."

C:
  - name: "Zelda : Tears of the Kingdom"
    desc: "Not to be an asshole or anything, this game feels like it was made by the executives who wanted Breath of the Wild 2.\n
    The game is okay, but it's just Breath of the Wild again, and the additions do not make up for how dissapointingly mild the game was."

  - name: "Evil Egg"
    desc: "An arcade shooter with arguably too much bitcrush.\n
    Game feels good, sound work is great. This isn't a big project, and it's not supposed to be anything huge, and it just... works."


  - name: "Splatoon 2"
    desc: "A good game, but dissapointing compared to Splatoon 1 & 3.\n
    What it lacks in freshness or inventive gameplay, it makes up for with great level design.\n
    It's just dissapointing and doesn't really expand on Splatoon 1's campaign."

  - name: "Dauntless"
    desc: "(Talking about the game before The Incident).\n
    Very fun monster hunting game more focused on learning enemy paterns than anything else.\n
    Art direction was good, monsters were nice and gameplay was fluid. I'll miss those nights of hiding the Switch in my room to play Dauntless until 3am..."

  - name: "Hyper Demon"
    desc: "This game cannot be accurately described. It is pure experience.\n
    I still don't understand how this game works, on a design level. Play it once, you'll see."

  - name: "Superliminal"
    desc: "Trippy fucking game.\n
    The story's nice, but doesn't go far.\n
    Makes nice use of its mechanics, but never really expands too much.\n
    Definitely an experience, but not really life changing or anything.\n
    The redeeming quality is that conceptual representation is always cool."

  - name: "Jet Set Radio"
    desc: "Gameplay and story aren't that great if I'm honest.\n
    But this game started an entire new genre of music and art, so I don't really mind. It's... an experience."

  - name: "Control"
    desc: "Great gameplay and environnements, but poor level design and story.\n
    I really loved the art direction for the environnements, and the themes of the game.\n
    But somehow, every bit of gameplay felt... restrained by the game's level degign, which is the opposite of what it should be..."

D:
  - name: "The Low Road"
    desc: "A good little adventure, but very short, with very few complex puzzles.\n
    The story is nice, but never really gets super interesting or anything.\n
    In my opinion, the game had more potential than what it ended up being."

  - name: "SLUDGE LIFE 2"
    desc: "A nice little game, 100% finishable in like, less than 5 hours.\n
    The art direction is cool, but you can quickly get bored of it.\n
    Humor's nice, and message is kinda good ? But that's it."

  - name: "Starbound"
    desc: "A great game that could've been an excellent game but ended up a good game.\n
    Starbound's beta was better than the final game we have today.\n
    Chucklefish abandonned it and although the modding community is one of the best in history, the game is just... not great. Not bad, but not great like it could've been."


E:
  - name: "Super Smash Bros. Ultimate"
    desc: "(SINGLEPLAYER WISE)\nI don't know. I expected something... More. 
    The only interesting part of the singleplayer was the map ? And that's pretty bad.\n
    This singleplayer basically only has value for people who already are fans of the base game."

  - name: "Hyper Light Breaker"
    desc: "Sequel to the famed Hyper Light Drifter,\n
    Breaker seeked to turn the game's world and ambience into a 3D open-world roguelite.\n
    The game is actually quite fun, good looking, and with good asseting now, despite its terrible release.
    But, the producers have decided to end development, so this game will forever be nothing more than waster potential."

F:
  - name: "Dauntless : Awakening"
    desc: "Oh, how deep fall those who once soared high...\n
    Whodda thunk that getting bought by a crypto company would ruin a game ! There's nothing left : monster intelligence was gutted, performance worsened and art direction was neutered. And you have to pay for weapons instead of crafting them from monster parts...\n I'll miss you, buddy."
